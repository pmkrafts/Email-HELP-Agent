# Streamlit theme mapped to the project design system, in both polarities.
# The single structural accent is the blue primary; the canvas is the warm paper tone (light) or
# the indigo night tone (dark) and every card/field sits on the secondary surface. Widget internals
# (radios, checkboxes, sliders, tabs, selections) take these colours natively, so the app's own CSS
# only has to handle type, radii and chrome.
#
# The app follows the Streamlit theme setting (menu: Settings → Theme: System / Light / Dark);
# the script reads the active type and swaps its stylesheet to match.

[theme]
font = "sans serif"                   # Inter is loaded by the app's stylesheet

[theme.light]
primaryColor = "#0075de"              # the one structural accent
backgroundColor = "#f6f5f4"           # warm paper-soft canvas
secondaryBackgroundColor = "#ffffff"  # cards, fields, sidebar
textColor = "#31302e"                 # warm charcoal body

[theme.dark]
primaryColor = "#62aef0"              # same blue family, lightened for dark surfaces
backgroundColor = "#171a2e"           # indigo night canvas
secondaryBackgroundColor = "#1f2338"  # cards, fields, sidebar
textColor = "#d5d2ce"

[server]
headless = true

[browser]
gatherUsageStats = false
